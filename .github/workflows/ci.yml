name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx astro build

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Package
        run: cd dist && zip -r ../matter-learn-site.zip .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="release-$(date -u +%Y%m%d-%H%M%S)"
          TITLE="$(date -u +%Y-%m-%d) 构建"
          gh release create "$TAG" matter-learn-site.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "自动构建，包含静态站点产物，可直接部署到 Nginx 或 Cloudflare Pages。" \
            --latest
