<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="950" cy="120" r="200" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.15"/>
  <circle cx="1000" cy="150" r="140" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.1"/>

  <!-- Icon: layers (simplified Matter/protocol icon) -->
  <g transform="translate(100, 180)" stroke="#a5b4fc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24.83 2.18a4 4 0 0 0-3.66 0L2.6 12.08a2 2 0 0 0 0 3.83l18.58 9.91a4 4 0 0 0 3.66 0l18.58-9.9a2 2 0 0 0 0-3.83z" transform="scale(1.5)"/>
    <path d="M2 24a2 2 0 0 0 1.16 1.82l18.6 9.91a4 4 0 0 0 3.65 0l18.58-9.9A2 2 0 0 0 46 24" transform="scale(1.5)"/>
    <path d="M2 34a2 2 0 0 0 1.16 1.82l18.6 9.91a4 4 0 0 0 3.65 0l18.58-9.9A2 2 0 0 0 46 34" transform="scale(1.5)"/>
  </g>

  <!-- Title -->
  <text x="100" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-1">Matter 协议学习中心</text>

  <!-- Subtitle -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#c7d2fe" opacity="0.9">智能家居统一标准 · 核心概念 · Cluster 速查 · 数据解析</text>

  <!-- Bottom accent bar -->
  <rect x="100" y="440" width="80" height="4" rx="2" fill="url(#accent)"/>

  <!-- URL -->
  <text x="100" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#818cf8" opacity="0.7">matter-learn.flyooo.uk</text>
</svg>
